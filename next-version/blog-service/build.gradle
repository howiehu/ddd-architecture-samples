buildscript {
    repositories {
        mavenCentral()
        jcenter()
    }
}

plugins {
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'dev.huhao.samples.ddd'
version = '1.0.0'
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    jcenter()
}

ext {
    mybatisVersion = '3.0.3'
//    archunitVersion = '0.13.1'
}

dependencies {
    implementation project(':proto')

    implementation 'org.springframework.boot:spring-boot-starter'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }

    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
    testImplementation 'io.grpc:grpc-testing:1.61.1'

    implementation 'com.google.guava:guava:33.0.0-jre'

    runtimeOnly 'com.h2database:h2'

    implementation 'org.flywaydb:flyway-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisVersion}"
    testImplementation "org.mybatis.spring.boot:mybatis-spring-boot-starter-test:${mybatisVersion}"

//    testImplementation "com.tngtech.archunit:archunit-junit5-api:${archunitVersion}"
//    testRuntimeOnly "com.tngtech.archunit:archunit-junit5-engine:${archunitVersion}"
}

test {
    useJUnitPlatform()
}
